<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 410" width="360" height="410" role="img"><title>La garra de la mano guía y el agarre del cuchillo</title><style>.i-bg{fill:var(--i-bg,#f6efe6)}.i-card{fill:var(--i-card,#fffaf3)}.i-ink{fill:none;stroke:var(--i-ink,#3a2e26);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.i-line{fill:none;stroke:var(--i-line,#d8c9b8);stroke-width:1.5}.i-dash{fill:none;stroke-width:2.4;stroke-dasharray:6 5;stroke-linecap:round}.i-tx{fill:var(--i-ink,#3a2e26);font:600 15px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.i-big{fill:var(--i-ink,#3a2e26);font:700 19px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.i-t2{fill:var(--i-ink2,#6a5a4d);font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.i-num{fill:var(--i-onacc,#fff);font:800 23px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.i-board{fill:var(--i-board,#e0bf94)}.i-steel{fill:var(--i-steel,#cfd6dc)}.i-handle{fill:var(--i-handle,#6b4a35)}.i-skin{fill:var(--i-skin,#f0c4a0)}.i-carrot{fill:var(--i-carrot,#ee8a2e)}.i-carrot2{fill:var(--i-carrot2,#f6b36b)}.i-onion{fill:var(--i-onion,#b5578f)}.i-wht{fill:var(--i-wht,#fffaf0)}.i-yel{fill:var(--i-yel,#f2bd2f)}.i-yel2{fill:var(--i-yel2,#f7dc86)}.i-water{fill:var(--i-water,#8fc3e8)}.i-pot{fill:var(--i-pot,#b9c1c9)}.i-raw{fill:var(--i-raw,#e99a94)}.i-fish{fill:var(--i-fish,#9fb4c4)}.i-green{fill:var(--i-green,#5aa046)}.i-red{fill:var(--i-red,#d2453b)}.i-acc{fill:var(--i-acc,#c2501a)}.i-grn{fill:var(--i-grn,#3d8b2f)}.i-blue{fill:var(--i-blue,#2f77b0)}.i-bread{fill:var(--i-bread,#e3b878)}.i-cheese{fill:var(--i-cheese,#f4cf5c)}.i-rice{fill:var(--i-rice,#f4ecd8)}.s-acc{stroke:var(--i-acc,#c2501a)}.s-grn{stroke:var(--i-grn,#3d8b2f)}.s-red{stroke:var(--i-red,#d2453b)}</style><rect class="i-bg" width="360" height="410" rx="16"/><rect class="i-card" x="12" y="10" width="336" height="190" rx="12"/><rect class="i-card" x="12" y="210" width="336" height="190" rx="12"/><text class="i-tx" x="28" y="36" text-anchor="start">1 · La garra (mano que sostiene)</text><rect class="i-board" x="26" y="140" width="308" height="14" rx="4"/><rect class="i-ink" x="26" y="140" width="308" height="14" rx="4"/><rect class="i-carrot" x="44" y="116" width="270" height="24" rx="11"/><rect class="i-ink" x="44" y="116" width="270" height="24" rx="11"/><path class="i-steel" d="M178 52 H198 V140 H178 Z"/><path class="i-ink" d="M178 52 H198 V140 H178 Z"/><path d="M198 52 V140" stroke="var(--i-ink,#3a2e26)" stroke-width="4"/><polyline points="104,92 160,98 150,118" fill="none" stroke="var(--i-ink,#3a2e26)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/><polyline points="104,92 160,98 150,118" fill="none" stroke="var(--i-skin,#f0c4a0)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><ellipse class="i-skin" cx="88" cy="92" rx="30" ry="25"/><ellipse class="i-ink" cx="88" cy="92" rx="30" ry="25"/><polyline points="104,92 160,98 150,118" fill="none" stroke="var(--i-skin,#f0c4a0)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><circle cx="164" cy="98" r="6" fill="none" stroke="var(--i-acc,#c2501a)" stroke-width="3"/><text class="i-t2" x="210" y="82" text-anchor="start">Los nudillos tocan</text><text class="i-t2" x="210" y="99" text-anchor="start">la hoja y la guían</text><path d="M208 90 H176" class="i-ink s-acc" stroke-width="2.4"/><text class="i-t2" x="28" y="176" text-anchor="start">Las puntas de los dedos van hacia</text><text class="i-t2" x="28" y="193" text-anchor="start">adentro, nunca estiradas.</text><text class="i-tx" x="28" y="236" text-anchor="start">2 · El agarre (pellizco)</text><path class="i-steel" d="M168 276 H52 Q38 282 42 294 Q64 314 168 314 Z"/><path class="i-ink" d="M168 276 H52 Q38 282 42 294 Q64 314 168 314 Z"/><rect class="i-handle" x="168" y="274" width="164" height="42" rx="14"/><rect class="i-ink" x="168" y="274" width="164" height="42" rx="14"/><rect class="i-skin" x="206" y="262" width="22" height="64" rx="11"/><rect class="i-ink" x="206" y="262" width="22" height="64" rx="11"/><rect class="i-skin" x="234" y="262" width="22" height="64" rx="11"/><rect class="i-ink" x="234" y="262" width="22" height="64" rx="11"/><rect class="i-skin" x="262" y="262" width="22" height="64" rx="11"/><rect class="i-ink" x="262" y="262" width="22" height="64" rx="11"/><rect class="i-skin" x="134" y="252" width="26" height="46" rx="13"/><rect class="i-ink" x="134" y="252" width="26" height="46" rx="13"/><rect class="i-skin" x="134" y="294" width="26" height="40" rx="13"/><rect class="i-ink" x="134" y="294" width="26" height="40" rx="13"/><ellipse cx="147" cy="295" rx="30" ry="46" class="i-dash s-acc"/><text class="i-t2" x="28" y="358" text-anchor="start">Pulgar e índice pellizcan la base de la hoja;</text><text class="i-t2" x="28" y="376" text-anchor="start">los otros dedos cierran el mango.</text></svg>
