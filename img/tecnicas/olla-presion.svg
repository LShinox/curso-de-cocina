<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 348" width="360" height="348" role="img"><title>Olla de presión: llenado máximo 2/3 (granos, la mitad), válvula y goma, y liberar la presión</title><style>.i-bg{fill:var(--i-bg,#f6efe6)}.i-card{fill:var(--i-card,#fffaf3)}.i-ink{fill:none;stroke:var(--i-ink,#3a2e26);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.i-line{fill:none;stroke:var(--i-line,#d8c9b8);stroke-width:1.5}.i-dash{fill:none;stroke-width:2.4;stroke-dasharray:6 5;stroke-linecap:round}.i-tx{fill:var(--i-ink,#3a2e26);font:600 15px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.i-big{fill:var(--i-ink,#3a2e26);font:700 19px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.i-t2{fill:var(--i-ink2,#6a5a4d);font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.i-num{fill:var(--i-onacc,#fff);font:800 23px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.i-board{fill:var(--i-board,#e0bf94)}.i-steel{fill:var(--i-steel,#cfd6dc)}.i-handle{fill:var(--i-handle,#6b4a35)}.i-skin{fill:var(--i-skin,#f0c4a0)}.i-carrot{fill:var(--i-carrot,#ee8a2e)}.i-carrot2{fill:var(--i-carrot2,#f6b36b)}.i-onion{fill:var(--i-onion,#b5578f)}.i-wht{fill:var(--i-wht,#fffaf0)}.i-yel{fill:var(--i-yel,#f2bd2f)}.i-yel2{fill:var(--i-yel2,#f7dc86)}.i-water{fill:var(--i-water,#8fc3e8)}.i-pot{fill:var(--i-pot,#b9c1c9)}.i-raw{fill:var(--i-raw,#e99a94)}.i-fish{fill:var(--i-fish,#9fb4c4)}.i-green{fill:var(--i-green,#5aa046)}.i-red{fill:var(--i-red,#d2453b)}.i-acc{fill:var(--i-acc,#c2501a)}.i-grn{fill:var(--i-grn,#3d8b2f)}.i-blue{fill:var(--i-blue,#2f77b0)}.i-bread{fill:var(--i-bread,#e3b878)}.i-cheese{fill:var(--i-cheese,#f4cf5c)}.i-rice{fill:var(--i-rice,#f4ecd8)}.s-acc{stroke:var(--i-acc,#c2501a)}.s-grn{stroke:var(--i-grn,#3d8b2f)}.s-red{stroke:var(--i-red,#d2453b)}</style><rect class="i-bg" width="360" height="348" rx="16"/><path class="i-pot" d="M44 128 H15