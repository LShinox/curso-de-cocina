<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" role="img"><title>Tabla de cortar: una para crudo (carne, pollo, pescado) y otra para lo que se come sin cocinar</title><style>.i-bg{fill:var(--i-bg,#f6efe6)}.i-card{fill:var(--i-card,#fffaf3)}.i-ink{fill:none;stroke:var(--i-ink,#3a2e26);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.i-line{fill:none;stroke:var(--i-line,#d8c9b8);stroke-width:1.5}.i-dash{fill:none;stroke-width:2.4;stroke-dasharray:6 5;stroke-linecap:round}.i-tx{fill:var(--i-ink,#3a2e26);font:600 15px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.i-big{fill:var(--i-ink,#3a2e26);font:700 19px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.i-t2{fill:var(--i-ink2,#6a5a4d);font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.i-num{fill:var(--i-onacc,#fff);font:800 23px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.i-board{fill:var(--i-board,#e0bf94)}.i-steel{fill:var(--i-steel,#cfd6dc)}.i-handle{fill:var(--i-handle,#6b4a35)}.i-skin{fill:var(--i-skin,#f0c4a0)}.i-carrot{fill:var(--i-carrot,#ee8a2e)}.i-carrot2{fill:var(--i-carrot2,#f6b36b)}.i-onion{fill:var(--i-onion,#b5578f)}.i-wht{fill:var(--i-wht,#fffaf0)}.i-yel{fill:var(--i-yel,#f2bd2f)}.i-yel2{fill:var(--i-yel2,#f7dc86)}.i-water{fill:var(--i-water,#8fc3e8)}.i-pot{fill:var(--i-pot,#b9c1c9)}.i-raw{fill:var(--i-raw,#e99a94)}.i-fish{fill:var(--i-fish,#9fb4c4)}.i-green{fill:var(--i-green,#5aa046)}.i-red{fill:var(--i-red,#d2453b)}.i-acc{fill:var(--i-acc,#c2501a)}.i-grn{fill:var(--i-grn,#3d8b2f)}.i-blue{fill:var(--i-blue,#2f77b0)}.i-bread{fill:var(--i-bread,#e3b878)}.i-cheese{fill:var(--i-cheese,#f4cf5c)}.i-rice{fill:var(--i-rice,#f4ecd8)}.s-acc{stroke:var(--i-acc,#c2501a)}.s-grn{stroke:var(--i-grn,#3d8b2f)}.s-red{stroke:var(--i-red,#d2453b)}</style><rect class="i-bg" width="360" height="330" rx="16"/><text class="i-tx" x="87" y="30" text-anchor="middle">Tabla A · crudo</text><text class="i-tx" x="273" y="30" text-anchor="middle">Tabla B · listo</text><rect class="i-board" x="14" y="44" width="146" height="112" rx="14"/><rect class="i-ink" x="14" y="44" width="146" height="112" rx="14"/><circle class="i-ink" cx="30" cy="62" r="5"/><rect class="i-board" x="200" y="44" width="146" height="112" rx="14"/><rect class="i-ink" x="200" y="44" width="146" height="112" rx="14"/><circle class="i-ink" cx="330" cy="62" r="5"/><rect class="i-red" x="14" y="150" width="146" height="6" rx="3"/><rect class="i-grn" x="200" y="150" width="146" height="6" rx="3"/><g transform="translate(62 104) rotate(-28)"><ellipse class="i-raw" rx="26" ry="16"/><ellipse class="i-ink" rx="26" ry="16" stroke-width="1.8"/><rect class="i-wht" x="22" y="-5" width="22" height="10" rx="5"/><rect class="i-ink" x="22" y="-5" width="22" height="10" rx="5" stroke-width="1.8"/></g><g transform="translate(116 118)"><ellipse class="i-fish" rx="22" ry="11"/><path class="i-fish" d="M18 0 L34 -10 L34 10 Z"/><ellipse class="i-ink" rx="22" ry="11" stroke-width="1.8"/><circle class="i-ink" cx="-12" cy="-2" r="1.8"/></g><text class="i-t2" x="87" y="178" text-anchor="middle">carne, pollo, pescado</text><circle class="i-red" cx="232" cy="98" r="16"/><circle class="i-ink" cx="232" cy="98" r="16" stroke-width="1.8"/><path class="i-green" d="M232 82 l-6 -2 l5 3 l-3 5 l4 -3 l4 3 l-1 -5 l5 -3 z"/><path class="i-green" d="M262 84 q16 -14 30 0 q10 16 -2 28 q-16 8 -28 -4 q-6 -12 0 -24 z"/><path class="i-ink" d="M262 84 q16 -14 30 0 q10 16 -2 28 q-16 8 -28 -4 q-6 -12 0 -24 z" stroke-width="1.8"/><path d="M270 112 q4 -16 12 -22" class="i-ink" stroke-width="1.4"/><path class="i-bread" d="M304 112 v-14 q-8 -4 -4 -12 q10 -10 22 -10 q12 0 18 8 q4 8 -4 14 v14 z"/><path class="i-ink" d="M304 112 v-14 q-8 -4 -4 -12 q10 -10 22 -10 q12 0 18 8 q4 8 -4 14 v14 z" stroke-width="1.8"/><path class="i-cheese" d="M222 122 L262 116 L262 132 L222 134 Z"/><path class="i-ink" d="M222 122 L262 116 L262 132 L222 134 Z" stroke-width="1.8"/><circle class="i-ink" cx="236" cy="126" r="2" stroke-width="1.2"/><text class="i-t2" x="273" y="178" text-anchor="middle">verduras, pan, queso</text><circle cx="180" cy="100" r="15" fill="var(--i-card,#fffaf3)" stroke="var(--i-red,#d2453b)" stroke-width="3.2"/><path d="M169 111 L191 89" stroke="var(--i-red,#d2453b)" stroke-width="3.2" stroke-linecap="round"/><line class="i-line" x1="20" y1="192" x2="340" y2="192"/><text class="i-t2" x="24" y="214" text-anchor="start">Tablas separadas: no se mezclan.</text><text class="i-t2" x="24" y="234" text-anchor="start">Después de lo crudo: agua caliente y jabón.</text><text class="i-t2" x="24" y="254" text-anchor="start">No laves el pollo crudo: sécalo con papel.</text><text class="i-t2" x="24" y="274" text-anchor="start">Una sola tabla: primero lo que se come crudo,</text><text class="i-t2" x="24" y="291" text-anchor="start">y la carne al final.</text><text class="i-t2" x="24" y="313" text-anchor="start">En la refri: carne cruda abajo y tapada.</text></svg>
