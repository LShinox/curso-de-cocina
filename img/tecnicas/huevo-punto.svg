<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 276" width="360" height="276" role="img"><title>Punto del huevo: blando, medio y duro, con sus tiempos</title><style>.i-bg{fill:var(--i-bg,#f6efe6)}.i-card{fill:var(--i-card,#fffaf3)}.i-ink{fill:none;stroke:var(--i-ink,#3a2e26);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.i-line{fill:none;stroke:var(--i-line,#d8c9b8);stroke-width:1.5}.i-dash{fill:none;stroke-width:2.4;stroke-dasharray:6 5;stroke-linecap:round}.i-tx{fill:var(--i-ink,#3a2e26);font:600 15px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.i-big{fill:var(--i-ink,#3a2e26);font:700 19px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.i-t2{fill:var(--i-ink2,#6a5a4d);font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.i-num{fill:var(--i-onacc,#fff);font:800 23px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.i-board{fill:var(--i-board,#e0bf94)}.i-steel{fill:var(--i-steel,#cfd6dc)}.i-handle{fill:var(--i-handle,#6b4a35)}.i-skin{fill:var(--i-skin,#f0c4a0)}.i-carrot{fill:var(--i-carrot,#ee8a2e)}.i-carrot2{fill:var(--i-carrot2,#f6b36b)}.i-onion{fill:var(--i-onion,#b5578f)}.i-wht{fill:var(--i-wht,#fffaf0)}.i-yel{fill:var(--i-yel,#f2bd2f)}.i-yel2{fill:var(--i-yel2,#f7dc86)}.i-water{fill:var(--i-water,#8fc3e8)}.i-pot{fill:var(--i-pot,#b9c1c9)}.i-raw{fill:var(--i-raw,#e99a94)}.i-fish{fill:var(--i-fish,#9fb4c4)}.i-green{fill:var(--i-green,#5aa046)}.i-red{fill:var(--i-red,#d2453b)}.i-acc{fill:var(--i-acc,#c2501a)}.i-grn{fill:var(--i-grn,#3d8b2f)}.i-blue{fill:var(--i-blue,#2f77b0)}.i-bread{fill:var(--i-bread,#e3b878)}.i-cheese{fill:var(--i-cheese,#f4cf5c)}.i-rice{fill:var(--i-rice,#f4ecd8)}.s-acc{stroke:var(--i-acc,#c2501a)}.s-grn{stroke:var(--i-grn,#3d8b2f)}.s-red{stroke:var(--i-red,#d2453b)}</style><rect class="i-bg" width="360" height="276" rx="16"/><ellipse class="i-wht" cx="62" cy="84" rx="38" ry="50"/><ellipse class="i-ink" cx="62" cy="84" rx="38" ry="50"/><circle class="i-yel" cx="62" cy="90" r="21"/><path d="M55 106 q0 14 7 14 q7 0 7 -14" class="i-yel"/><path d="M48 86 a16 16 0 0 1 12 -10" fill="none" stroke="var(--i-wht,#fffaf0)" stroke-width="3" stroke-linecap="round"/><circle class="i-ink" cx="62" cy="90" r="21" stroke-width="1.4" opacity=".55"/><text class="i-tx" x="62" y="168" text-anchor="middle">Blando</text><text class="i-big" x="62" y="192" text-anchor="middle">7-8 min</text><text class="i-t2" x="62" y="210" text-anchor="middle">yema líquida</text><ellipse class="i-wht" cx="180" cy="84" rx="38" ry="50"/><ellipse class="i-ink" cx="180" cy="84" rx="38" ry="50"/><circle class="i-yel2" cx="180" cy="90" r="21"/><circle class="i-yel" cx="180" cy="90" r="11"/><circle class="i-ink" cx="180" cy="90" r="21" stroke-width="1.4" opacity=".55"/><text class="i-tx" x="180" y="168" text-anchor="middle">Medio</text><text class="i-big" x="180" y="192" text-anchor="middle">9-10 min</text><text class="i-t2" x="180" y="210" text-anchor="middle">yema cremosa</text><ellipse class="i-wht" cx="298" cy="84" rx="38" ry="50"/><ellipse class="i-ink" cx="298" cy="84" rx="38" ry="50"/><circle class="i-yel2" cx="298" cy="90" r="21"/><circle class="i-yel" cx="290" cy="84" r="1.8"/><circle class="i-yel" cx="304" cy="81" r="1.8"/><circle class="i-yel" cx="308" cy="94" r="1.8"/><circle class="i-yel" cx="294" cy="98" r="1.8"/><circle class="i-yel" cx="287" cy="97" r="1.8"/><circle class="i-yel" cx="301" cy="104" r="1.8"/><circle class="i-yel" cx="306" cy="103" r="1.8"/><circle class="i-ink" cx="298" cy="90" r="21" stroke-width="1.4" opacity=".55"/><text class="i-tx" x="298" y="168" text-anchor="middle">Duro</text><text class="i-big" x="298" y="192" text-anchor="middle">12-13 min</text><text class="i-t2" x="298" y="210" text-anchor="middle">yema firme</text><line class="i-line" x1="20" y1="224" x2="340" y2="224"/><text class="i-t2" x="180" y="244" text-anchor="middle">Tiempos a 2.800 m, desde que hierve el agua</text><text class="i-t2" x="180" y="262" text-anchor="middle">Al sacarlos: agua fría 5 minutos</text></svg>
