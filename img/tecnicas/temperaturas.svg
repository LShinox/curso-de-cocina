<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 346" width="360" height="346" role="img"><title>Temperaturas internas seguras: pollo 74 °C, carne molida 71 °C, cortes enteros de cerdo y res 63 °C, pescado 63 °C</title><style>.i-bg{fill:var(--i-bg,#f6efe6)}.i-card{fill:var(--i-card,#fffaf3)}.i-ink{fill:none;stroke:var(--i-ink,#3a2e26);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.i-line{fill:none;stroke:var(--i-line,#d8c9b8);stroke-width:1.5}.i-dash{fill:none;stroke-width:2.4;stroke-dasharray:6 5;stroke-linecap:round}.i-tx{fill:var(--i-ink,#3a2e26);font:600 15px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.i-big{fill:var(--i-ink,#3a2e26);font:700 19px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.i-t2{fill:var(--i-ink2,#6a5a4d);font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.i-num{fill:var(--i-onacc,#fff);font:800 23px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.i-board{fill:var(--i-board,#e0bf94)}.i-steel{fill:var(--i-steel,#cfd6dc)}.i-handle{fill:var(--i-handle,#6b4a35)}.i-skin{fill:var(--i-skin,#f0c4a0)}.i-carrot{fill:var(--i-carrot,#ee8a2e)}.i-carrot2{fill:var(--i-carrot2,#f6b36b)}.i-onion{fill:var(--i-onion,#b5578f)}.i-wht{fill:var(--i-wht,#fffaf0)}.i-yel{fill:var(--i-yel,#f2bd2f)}.i-yel2{fill:var(--i-yel2,#f7dc86)}.i-water{fill:var(--i-water,#8fc3e8)}.i-pot{fill:var(--i-pot,#b9c1c9)}.i-raw{fill:var(--i-raw,#e99a94)}.i-fish{fill:var(--i-fish,#9fb4c4)}.i-green{fill:var(--i-green,#5aa046)}.i-red{fill:var(--i-red,#d2453b)}.i-acc{fill:var(--i-acc,#c2501a)}.i-grn{fill:var(--i-grn,#3d8b2f)}.i-blue{fill:var(--i-blue,#2f77b0)}.i-bread{fill:var(--i-bread,#e3b878)}.i-cheese{fill:var(--i-cheese,#f4cf5c)}.i-rice{fill:var(--i-rice,#f4ecd8)}.s-acc{stroke:var(--i-acc,#c2501a)}.s-grn{stroke:var(--i-grn,#3d8b2f)}.s-red{stroke:var(--i-red,#d2453b)}</style><rect class="i-bg" width="360" height="346" rx="16"/><rect class="i-card" x="12" y="14" width="336" height="54" rx="12"/><rect class="i-red" x="20" y="22" width="92" height="38" rx="10"/><text class="i-num" x="66" y="48" text-anchor="middle">74 °C</text><text class="i-tx" x="124" y="39" text-anchor="start">Pollo y pavo</text><text class="i-t2" x="124" y="57" text-anchor="start">jugo claro, sin rosado</text><rect class="i-card" x="12" y="76" width="336" height="54" rx="12"/><rect class="i-acc" x="20" y="84" width="92" height="38" rx="10"/><text class="i-num" x="66" y="110" text-anchor="middle">71 °C</text><text class="i-tx" x="124" y="101" text-anchor="start">Carne molida y albóndigas</text><text class="i-t2" x="124" y="119" text-anchor="start">sin rosado por dentro</text><rect class="i-card" x="12" y="138" width="336" height="54" rx="12"/><rect class="i-grn" x="20" y="146" width="92" height="38" rx="10"/><text class="i-num" x="66" y="172" text-anchor="middle">63 °C</text><text class="i-tx" x="124" y="163" text-anchor="start">Cerdo y res (cortes enteros)</text><text class="i-t2" x="124" y="181" text-anchor="start">cerdo: reposa 3 minutos</text><rect class="i-card" x="12" y="200" width="336" height="54" rx="12"/><rect class="i-blue" x="20" y="208" width="92" height="38" rx="10"/><text class="i-num" x="66" y="234" text-anchor="middle">63 °C</text><text class="i-tx" x="124" y="225" text-anchor="start">Pescado y camarón</text><text class="i-t2" x="124" y="243" text-anchor="start">opaco, en láminas</text><rect class="i-card" x="12" y="270" width="336" height="64" rx="12"/><rect class="i-steel" x="34" y="278" width="8" height="38" rx="4"/><rect class="i-ink" x="34" y="278" width="8" height="38" rx="4"/><circle class="i-red" cx="38" cy="322" r="8"/><circle class="i-ink" cx="38" cy="322" r="8"/><rect class="i-red" x="36" y="294" width="4" height="22"/><text class="i-tx" x="62" y="298" text-anchor="start">Termómetro en lo más grueso,</text><text class="i-tx" x="62" y="317" text-anchor="start">sin tocar el hueso.</text></svg>
